{% extends "base/base.html" %}
{% load static %}

{% block title %}Upload Document{% endblock %}

{% block content %}
<div class="upload-container">
    <div class="upload-card">
        <h2><i class="fas fa-cloud-upload-alt"></i> Upload Document</h2>

        <!-- Success & Error Alerts -->
        <div id="successAlert" class="alert alert-success d-none" role="alert"></div>
        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

        <!-- Upload Form -->
        <form id="uploadForm" enctype="multipart/form-data">
            {% csrf_token %}
            <!-- Drag & Drop Zone -->
            <div class="drop-zone" id="dropZone">
                <i class="fas fa-file-alt file-icon"></i>
                <p>Drag & Drop Files Here</p>
                <p class="or-text">or</p>

                <!-- Browse Button -->
                <label class="custom-file-upload" id="browseBtn">
                    <i class="fas fa-folder-open"></i> Browse Files
                    <input type="file" id="fileInput" name="document" hidden>
                </label>
            </div>

            <!-- Selected File Preview -->
            <div id="selectedFile" class="selected-file d-none">
                <span id="fileName"></span>
                <button type="button" class="btn btn-sm btn-danger" id="removeFile">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="progress mt-3 d-none" id="progressBarContainer">
                <div id="progressBar" class="progress-bar" role="progressbar" 
                     style="width: 0%;" aria-valuemin="0" aria-valuemax="100">
                    <span id="progressText">0%</span>
                </div>
            </div>

            <!-- Upload Button -->
            <button type="submit" id="uploadButton" class="btn-upload mt-3">
                <i class="fas fa-upload"></i> Upload Document
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<!-- Custom JS (after jQuery & Bootstrap) -->
<script src="{% static 'Document/js/upload.js' %}"></script>
{% endblock %}
